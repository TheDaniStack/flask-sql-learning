<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Student</title>
</head>
<body>

    <form method="POST">
        
        <label for="edit-name">Name</label>
        <input id="edit-name" type="text" name="name" value="{{ student['name'] }}" placeholder="Name">
    
        <label for="edit-age">Age</label>
        <input id="edit-age" type="text" name="age" value="{{ student['age'] }}"  placeholder="Age">

        <button type="submit">Save Changes</button>
        
    </form>
    
</body>
</html>
